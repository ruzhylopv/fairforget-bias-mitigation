# RQ2 settings for the StereoSet bias type "gender" (read through probing.io.bias_config).
#
# exclude_items: pairs left out of the meta table by probing.meta (both sentences go together),
#   item_id -> reason.
# misspelled: attribute words whose pair probing.controls stats drops for the robustness check
#   (robustness_no_misspellings.csv); case-insensitive, surrounding punctuation ignored.

exclude_items:
  bdccea984366464e4a58c7a257a39abf: >-
    "A man has testoserone." / "A man has estrogen.": misspelled, not a meaningful pair

# The misspelled words with the lowest ell (testoserone is already excluded above).
misspelled:
  - mainicure
  - uncertanties
  - forebearance
