# RQ2 settings for the StereoSet bias type "race" (read through probing.io.bias_config).
# Reviewed 2026-11-21 from scripts/rq2_data_check.py (results/rq2/data_check/race.md), card [6].
#
# exclude_items: pairs left out of the meta table (both sentences), item_id -> reason. Only
#   structurally broken pairs: the first differing token is not in the attribute word, or the
#   blank was filled with a run-together sentence or a phrase (found in gate 1 check 4, 2026-11-21).
# misspelled: typos and non-words (wordfreq zipf 0, checked by hand); probing.controls stats
#   drops their pairs in robustness_no_misspellings.csv only.
# Not listed (zipf 0 but kept as they are): compounds written without a hyphen or space
#   (businessowner cleancut closeminded freespirited hardworkers hottempered hulahoop noaccent
#   peaceloving redhaired selfsufficient snaggletoothed southamerican straightlaced stuckup
#   welldressed welleducated wellspoken zenlike bugridden antizionist), rare but real words
#   (bigamists lisper macropenis monogamists nyctophobic unbathed uncaned wimpish), and slurs
#   (cameljockey ragheaded slanteye sliteyes towelhead): those are the stereotypes themselves.
# null_seeds: race has the most pairs (~3,930), so each null fit is the slowest and, with the
#   memory cap (~64-68 workers), 100 seeds would take ~10-15 h per run. 20 seeds (decided
#   2026-11-22): the smallest p is 1/21 = 0.048, so race p-values can show p < 0.05 and nothing
#   stronger; CIs and gaps come from the bootstrap and are unaffected. The report says so.
#   Profession uses 20 as well; gender, the headline result, keeps 100.

# null_positions: the null covers last_subtok only (the position the report and figures use),
#   halving its cost; p and p_corr exist for last_subtok probes only, p_corr is the max over
#   its layers. CIs and gaps are computed for both positions as before (decided 2026-11-22).

null_seeds: 20
null_positions: [last_subtok]

exclude_items:
  69af0dbd2998f82e05560f4eabe32d02: >-
    "doesnt" / "does": one word is a prefix of the other; the first differing token lies after "does"
  e1046e3f89f3dd2b33a867c5d60288ab: >-
    "oman" / "omani": one word is a prefix of the other ("People in omani are from oman/omani.")
  e9bd82bd11f8c5c35a7e8a66cc1cee04: >-
    anti-stereotype is a run-together sentence ("irishmanarenotleprochuans")
  05767ef34a97f15a24621f99dd59e384: >-
    anti-stereotype is a run-together sentence ("notallrussiansarecriminals"); the stereotype sentence is ungrammatical
  41ddaa1f16a2661991f309ebbe929c4d: >-
    anti-stereotype is a run-together sentence ("allgermanysdonothatejews")
  27dbef2db60fe89ff75304815207fa5a: >-
    anti-stereotype is a run-together sentence ("allgreeksarenotloud")
  66317ad75c763ba08fbd0553df8e6dfb: >-
    anti-stereotype is a run-together sentence ("albaniansareverylovelypoeple")
  784a9a4767261b9bc9660e440dc354d1: >-
    blank filled with a phrase ("alcoholism but are alcoholism" / "contributors but are contributors"):
    first and last subtoken are the same token
  94cc022d32961945fe79102b0c432d4b: >-
    blank filled with a phrase ("sherpa as a sherpa" / "doctor as a doctor")
  3e9887302e9f3293819245790a1c0dbf: >-
    blank filled with a phrase ("snobs that i have met but my new neighbor is very snobs" / "humble ...")

