[project]
name = "fairforget-unlearning"
version = "0.1.0"
description = "Experiments in machine unlearning and fairness"
readme = "README.md"
authors = [
    { name = "Ruzhylo Pavlo", email = "ruzhylo.pn@ucu.edu.ua" },
    { name = "Taras Kopach", email = "kopach.pn@ucu.edu.ua" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "numpy>=2.5.3",
    "pip>=26.2.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
